<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Black Hole Simulator</title>
  <style>
    html, body { margin:0; height:100%; background:#000; color:#e6f0ff; font-family:Inter,system-ui,sans-serif; overflow:hidden; }
    #app { position:fixed; inset:0; }
    .hud { position:fixed; top:12px; left:12px; background:rgba(8,12,24,.72); backdrop-filter: blur(6px); border:1px solid rgba(127,170,255,.25); border-radius:10px; padding:12px; width:min(360px, 92vw); z-index:10; }
    .hud h1{ margin:0 0 10px; font-size:16px; }
    .row{ display:grid; grid-template-columns: 1fr auto; gap:8px; align-items:center; margin:8px 0; }
    .row input[type=range]{ width:100%; }
    .small { font-size:12px; opacity:.85; margin-top:8px; line-height:1.4; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <h1>3D Black Hole Simulator</h1>
    <div class="row"><label for="mass">Mass (solar masses)</label><span class="mono" id="massVal">4.0e6</span></div>
    <input id="mass" type="range" min="1e4" max="5e7" value="4000000" step="1000" />
    <div class="row"><label for="spin">Spin</label><span class="mono" id="spinVal">0.70</span></div>
    <input id="spin" type="range" min="0" max="0.99" value="0.70" step="0.01" />
    <div class="row"><label for="disk">Disk turbulence</label><span class="mono" id="diskVal">0.65</span></div>
    <input id="disk" type="range" min="0" max="1" value="0.65" step="0.01" />
    <div class="row"><label>Schwarzschild radius</label><span class="mono" id="radiusKm">11,816,000 km</span></div>
    <div class="small">Mouse drag: orbit camera • Scroll: zoom • Uses a lightweight gravitational lensing approximation and animated accretion disk.</div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
